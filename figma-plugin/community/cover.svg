  <text x="150" y="420" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="40" fill="#8A8A99">Build the full kit in Figma — variables, text styles, 38 component sets —</text>
  <text x="150" y="478" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="40" fill="#8A8A99">then hand every screen to a coding agent as structured JSON.</text>

  
